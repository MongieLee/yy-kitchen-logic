user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/access.log;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    server {
        listen 443 ssl default_server;
        server_name leoli.icu;

        ssl_certificate /home/ubuntu/leoli.icu_nginx/leoli.icu_bundle.crt;
        ssl_certificate_key /home/ubuntu/leoli.icu_nginx/leoli.icu.key;

        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers on;

        client_max_body_size 50m;

        root /var/www/svn_ai_review/dist;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /crh/ {
            alias /var/www/code_review_hub/frontend/;
            index index.html;
            try_files $uri $uri/ /crh/index.html;
        }

        location = /crh {
            return 301 /crh/;
        }

        location /login {
            try_files /lcgaokao.html =404;
        }

        location = /yyadmin {
            return 301 /yyadmin/;
        }

        location /yyadmin/ {
            alias /var/www/yy-recipe-admin/;
            index index.html;
            try_files $uri $uri/ @yyadmin;
        }

        location @yyadmin {
            rewrite ^ /yyadmin/index.html last;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name leoli.icu;
        return 301 https://$server_name$request_uri;
    }
}
